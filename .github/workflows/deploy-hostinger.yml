name: Deploy To Hostinger

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publish dist to hostinger-deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin hostinger-deploy; then
            git fetch origin hostinger-deploy
            git worktree add .hostinger-deploy origin/hostinger-deploy
          else
            git worktree add --detach .hostinger-deploy
            cd .hostinger-deploy
            git checkout --orphan hostinger-deploy
            git commit --allow-empty -m "Initialize hostinger-deploy"
            cd ..
          fi

          rsync -a --delete dist/ .hostinger-deploy/

          cd .hostinger-deploy
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Deploy ${GITHUB_SHA}"
            git push origin HEAD:hostinger-deploy
          else
            echo "No changes to deploy"
          fi
