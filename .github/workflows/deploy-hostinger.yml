name: Deploy To Hostinger

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publish dist to hostinger-deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deploy_dir="$(mktemp -d)"
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${repo_url}" hostinger-deploy; then
            git clone --branch hostinger-deploy --single-branch "${repo_url}" "${deploy_dir}"
          else
            git clone --no-checkout "${repo_url}" "${deploy_dir}"
            cd "${deploy_dir}"
            git checkout --orphan hostinger-deploy
            git rm -rf . >/dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize hostinger-deploy"
            cd -
          fi

          rsync -a --delete dist/ "${deploy_dir}/"

          cd "${deploy_dir}"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Deploy ${GITHUB_SHA}"
            git push origin hostinger-deploy
          else
            echo "No changes to deploy"
          fi
